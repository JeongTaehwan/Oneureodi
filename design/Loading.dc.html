<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap">
  <style>
    body { margin: 0; font-family: 'Gowun Dodum', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
    a { color: #F28B6F; } a:hover { color: #D9694C; }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    .dot { animation: bob 1.1s ease-in-out infinite; }
    .dot2 { animation-delay: 0.18s; }
    .dot3 { animation-delay: 0.36s; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFBF5; color: #4A403B; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; position: relative; overflow: hidden;">
  <div style="position: absolute; top: 120px; left: -40px; width: 140px; height: 140px; border-radius: 50%; background: #FFE4D6;"></div>
  <div style="position: absolute; bottom: 160px; right: -30px; width: 110px; height: 110px; border-radius: 50%; background: #FFE4D6;"></div>
  <div style="display: flex; gap: 12px; position: relative;">
    <div class="dot" style="width: 18px; height: 18px; border-radius: 50%; background: #F28B6F;"></div>
    <div class="dot dot2" style="width: 18px; height: 18px; border-radius: 50%; background: #F6AD97;"></div>
    <div class="dot dot3" style="width: 18px; height: 18px; border-radius: 50%; background: #FFD0C0;"></div>
  </div>
  <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; position: relative;">
    <div style="font-size: 20px; line-height: 28px; color: #4A403B;">성수동 근처를 뒤지는 중</div>
    <div style="font-size: 14px; line-height: 20px; color: #8E8078;">처음 가는 동네는 20초쯤 걸려요</div>
  </div>
</div>
</x-dc>
</body>
</html>
